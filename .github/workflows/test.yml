  windows:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas y resumen de fallos
        shell: bash
        run: |
          python -m unittest discover -s tests 2>&1 | tee salida.txt || true
          echo "=== RESUMEN DE FALLOS ==="
          grep -E "^(FAIL|ERROR):" salida.txt | sort
